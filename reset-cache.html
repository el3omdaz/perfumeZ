<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>تنظيف كاش PerfumeZ</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09070d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;text-align:center;padding:24px}
.box{max-width:560px;background:rgba(255,255,255,.06);border:1px solid rgba(232,192,112,.35);border-radius:20px;padding:28px;box-shadow:0 20px 55px rgba(0,0,0,.35)}
h1{color:#e8c070;margin:0 0 12px;font-size:24px}p{line-height:1.8;color:rgba(255,255,255,.78)}.small{font-size:13px;color:rgba(255,255,255,.55)}
button{margin-top:14px;background:#e8c070;color:#1a1008;border:0;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>جاري تنظيف الكاش...</h1>
<p id="msg">نمسح Service Worker والكاش القديم حتى يفتح التطبيق بالنسخة الصحيحة.</p>
<p class="small">إذا لم يتم التحويل تلقائياً، اضغط الزر.</p>
<button onclick="location.href='./index.html?v=github-pages-fixed'">فتح التطبيق</button>
</div>
<script>
(async function(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(reg => reg.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(key => caches.delete(key)));
    }
    document.getElementById('msg').textContent = 'تم تنظيف الكاش. سيتم فتح التطبيق الآن.';
  } catch (e) {
    document.getElementById('msg').textContent = 'تمت المحاولة. سيتم فتح التطبيق الآن.';
  }
  setTimeout(() => location.replace('./index.html?v=github-pages-fixed'), 900);
})();
</script>
</body>
</html>
